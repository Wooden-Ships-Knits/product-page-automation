# =============================================================================
# Nginx reverse proxy for the PPA Streamlit app, with HTTPS via Let's Encrypt.
#
# An nginx "server" block is one virtual host. We have two:
#   - port 80  (HTTP)  : serves the Let's Encrypt challenge + redirects to HTTPS
#   - port 443 (HTTPS) : terminates TLS and proxies to the streamlit container
#
# 👉 To use your own domain, change it in THREE places below (marked CHANGE):
#    the two `server_name` lines and the two `ssl_certificate*` paths.
# =============================================================================

# ---- HTTP : port 80 ---------------------------------------------------------
server {
    listen 80;
    server_name product-page-automation.wooden-ships.com;   # CHANGE

    # Certbot proves you own the domain by fetching a file from this path.
    # nginx serves it from the shared webroot volume.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: force the browser to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS : port 443 -------------------------------------------------------
server {
    listen 443 ssl;
    server_name product-page-automation.wooden-ships.com;   # CHANGE

    # Certs issued by certbot. The folder is named after your domain.
    ssl_certificate     /etc/letsencrypt/live/product-page-automation.wooden-ships.com/fullchain.pem;   # CHANGE
    ssl_certificate_key /etc/letsencrypt/live/product-page-automation.wooden-ships.com/privkey.pem;     # CHANGE

    location / {
        # 'web' is the streamlit service name in docker-compose; Docker's internal
        # DNS resolves it to that container. 8501 is streamlit's port.
        proxy_pass http://web:8501;

        # --- WebSocket support (Streamlit's live updates run over a WebSocket) ---
        # Without these, the page loads but never becomes interactive.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Pass the real client + protocol info through to the app ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket connections open (default is 60s).
        proxy_read_timeout 86400;
    }
}
