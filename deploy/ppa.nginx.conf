# =============================================================================
# HOST (system) nginx site for the PPA app — for the nginx already installed on
# the Debian VM (apt), NOT a Docker container.
#
# Install on the VM:
#   sudo cp deploy/ppa.nginx.conf /etc/nginx/sites-available/ppa.conf
#   sudo ln -s /etc/nginx/sites-available/ppa.conf /etc/nginx/sites-enabled/ppa.conf
#   sudo rm -f /etc/nginx/sites-enabled/default          # drop the default site
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d product-page-automation.pt-infashion.com
#
# certbot's --nginx plugin then edits THIS file automatically to add the
# `listen 443 ssl` block, the cert paths, and an HTTP->HTTPS redirect, and sets
# up auto-renewal. You don't hand-write the TLS part.
# =============================================================================

server {
    listen 80;
    server_name product-page-automation.pt-infashion.com;

    location / {
        # The Docker 'web' container publishes 8501 on the host's loopback.
        proxy_pass http://127.0.0.1:8501;

        # WebSocket upgrade — Streamlit's live updates need this.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client + protocol info to the app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;   # keep long-lived WebSocket connections alive
    }
}
