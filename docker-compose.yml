# Two services from ONE image:
#   web   — the Streamlit UI (builds product pages, monitors the fetch)
#   fetch — runs cron_fetch.py hourly (the snapshot refresh)
# They share a data volume so the web UI can read the log the fetch writes, and
# so the downloaded IM workbook + Output persist across restarts.
#
# Secrets are NOT baked into the image — credentials/ and Setup/.env are bind-mounted
# read-only at runtime. Put both on the VM before `docker compose up`.

services:
  web:
    build: .
    image: ppa-app
    command: >
      streamlit run webapp/app.py
      --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    # Publish 8501 on the host's LOOPBACK only — the host's system nginx
    # reverse-proxies to it (see deploy/ppa.nginx.conf). Not exposed to the
    # internet, so you can close any 8501 rule in the GCP firewall.
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      IM_COLLECTION_BASE: /data/im_cache/Collection   # get_im_path() base on the VM
      PPA_FETCH_LOG: /data/logs/cron_fetch.log         # shared with the fetch service
      TZ: Asia/Jakarta                                 # match the fetch service's tz
      PPA_APP_PASSWORD: webadmin123                    # login password — CHANGE for production
    volumes:
      - ./credentials:/app/credentials:ro
      - ./Setup/.env:/app/Setup/.env:ro
      - ppa_data:/data                                 # im_cache + logs
      - ppa_output:/app/Output                         # product_link.txt persists
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5

  fetch:
    build: .
    image: ppa-app
    # Once a night at FETCH_AT (see deploy/fetch_nightly.sh) — safety net only; the
    # webhook service keeps PP SY LIST in sync in real time.
    # Old hourly loop (08-20): command ["sh", "/app/deploy/fetch_loop.sh"] + FETCH_START_HOUR/FETCH_END_HOUR.
    command: ["sh", "/app/deploy/fetch_nightly.sh"]
    environment:
      PPA_FETCH_LOG: /data/logs/cron_fetch.log
      TZ: Asia/Makassar        # FETCH_AT is in this tz (WITA, UTC+8)
      FETCH_AT: "00:00"
    volumes:
      - ./credentials:/app/credentials:ro
      - ./Setup/.env:/app/Setup/.env:ro
      - ppa_data:/data
    restart: unless-stopped

  webhook:
    build: .
    image: ppa-app
    # Shopify products/create|update|delete -> per-row PP SY LIST sync (webhook_receiver.py).
    # Loopback only; host nginx proxies /shopify/webhook to it (see deploy/ppa.nginx.conf).
    command: ["python", "webhook_receiver.py"]
    ports:
      - "127.0.0.1:8502:8502"
    environment:
      TZ: Asia/Jakarta
      WEBHOOK_PORT: "8502"
      WEBHOOK_DRY_RUN: "0"     # "1" = log planned sheet changes without writing
    volumes:
      - ./credentials:/app/credentials:ro
      - ./Setup/.env:/app/Setup/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8502/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5

# HTTPS/reverse-proxy is handled by the VM's HOST nginx (already installed),
# proxying to 127.0.0.1:8501 — see deploy/ppa.nginx.conf. No nginx/certbot here.

volumes:
  ppa_data:
  ppa_output:
