# Two services from ONE image:
#   web   — the Streamlit UI (builds product pages, monitors the fetch)
#   fetch — runs cron_fetch.py hourly (the snapshot refresh)
# They share a data volume so the web UI can read the log the fetch writes, and
# so the downloaded IM workbook + Output persist across restarts.
#
# Secrets are NOT baked into the image — credentials/ and Setup/.env are bind-mounted
# read-only at runtime. Put both on the VM before `docker compose up`.

services:
  web:
    build: .
    image: ppa-app
    command: >
      streamlit run webapp/app.py
      --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      IM_COLLECTION_BASE: /data/im_cache/Collection   # get_im_path() base on the VM
      PPA_FETCH_LOG: /data/logs/cron_fetch.log         # shared with the fetch service
      TZ: Asia/Jakarta                                 # match the fetch service's tz
      PPA_APP_PASSWORD: webadmin123                    # login password — CHANGE for production
    volumes:
      - ./credentials:/app/credentials:ro
      - ./Setup/.env:/app/Setup/.env:ro
      - ppa_data:/data                                 # im_cache + logs
      - ppa_output:/app/Output                         # product_link.txt persists
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5

  fetch:
    build: .
    image: ppa-app
    # Hourly loop, restricted to the local-time window below (see deploy/fetch_loop.sh).
    # For exact on-the-hour scheduling, swap for supercronic with `0 8-20 * * *`.
    command: ["sh", "/app/deploy/fetch_loop.sh"]
    environment:
      PPA_FETCH_LOG: /data/logs/cron_fetch.log
      TZ: Asia/Jakarta         # <-- SET TO YOUR TIMEZONE; the window below is in this tz
      FETCH_START_HOUR: "8"    # first hourly run
      FETCH_END_HOUR: "20"     # last hourly run (inclusive; use 19 to stop before 8pm)
    volumes:
      - ./credentials:/app/credentials:ro
      - ./Setup/.env:/app/Setup/.env:ro
      - ppa_data:/data
    restart: unless-stopped

volumes:
  ppa_data:
  ppa_output:
